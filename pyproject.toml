[tool.poetry]
name = "lead-agent"
version = "0.1.0"
description = "AI Lead Agent MVP for DigiArt Living Lab — qualifies, scores, deduplicates and routes leads. Business rules in pure Python, LLM called only when free text needs understanding."
authors = ["Amal <amal@digiart-livinglab.example>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
email-validator = "^2.2.0"
gspread = "^6.1.4"
google-auth = "^2.35.0"
pandas = "^2.2.3"
httpx = "^0.27.2"
python-dotenv = "^1.0.1"
tenacity = "^9.0.0"
openpyxl = "^3.1.5"
duckduckgo-search = "^7.5.5"
jinja2 = "^3.1.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
pytest-env = "^1.1.5"
black = "^24.10.0"
isort = "^5.13.2"
ruff = "^0.7.0"
pre-commit = "^4.0.1"
httpx = "^0.27.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"
env = [
    "DATA_SOURCE_MODE=prototype",
    "LLM_PROVIDER=ollama",
]
